# 모델별 원점수 경계값 (계획서 §5.2).
# 활성 모델: univfd, aide, bfree — 서버 기본 모델(detectors.DEFAULT_DETECTORS)과 같아야 한다.
# 활성 모델의 경계값이 없으면 /analyze가 판정하지 못한다(banding.ThresholdError → 500).
# ※ NPR은 2026-11-10 B-Free로 교체되어 활성 설정에서 뺐다(과거 기록: 계획서 §7 '11/10 점검 결과').
#
#   score < low          → weak       (AI 흔적 약함)
#   low ≤ score ≤ high   → uncertain  (판단하기 어려움)
#   score > high         → strong     (AI 흔적 강함)
#
# 근거 (2026-11-14, B6 절차 3·4번): ml/scores.csv 800장
#   = 실제 400(RAISE 원본 100 + jpeg70·resize50·screenshot) + AI 400(sdxl·sdxl-lightning·flux1-schnell 원본 100 + 같은 변형).
#   high: 모델별로 실제 사진 400장 중 strong 비율(FPR)이 약 5%가 되는 값.
#   low:  AI 이미지 400장의 대부분이 넘는 값.
#   단계 0 규칙 종합 판정(800장): 실제→strong 0.2%(1장), AI→strong 22%, AI→weak 4%, uncertain 54%.
#   분석: ml/reports/scores_분석_2026-11-12.md. 문제가 생기면 같은 절차로 다시 조정한다.
#   ※ 독립 원본은 실제 100장뿐이라(변형은 같은 원본에서 만듦) FPR 1%p 차이는 표본 오차 범위다.
univfd: { low: 0.0005, high: 0.39 }   # FPR 5.0%, AI→strong 17%, AI→weak 21%
aide:   { low: 0.10,   high: 0.92 }   # FPR 5.5%, AI→strong 14%, AI→weak 13%
bfree:  { low: 0.10,   high: 0.13 }   # FPR 5.0%, AI→strong 93%, AI→weak 6%
